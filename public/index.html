<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSIE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="header">
    <h1>ROSIE</h1>
    <p class="subtitle">Agentic CLI with browser interface</p>
  </header>

  <section class="status-bar">
    <span id="backend-status" class="status-indicator connecting">Connecting to backend...</span>
  </section>

  <main class="main-content">
    <section class="panel">
      <h2>Conversation</h2>
      <div id="conversation" class="conversation-area">
        <p class="placeholder">Submit a task to see it appear here.</p>
      </div>
    </section>

    <section class="panel">
      <h2>Task</h2>
      <form id="input-form" class="input-form" autocomplete="off">
        <textarea
          id="prompt-input"
          name="prompt"
          placeholder="Enter a task for ROSIE..."
          rows="3"
        ></textarea>
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
